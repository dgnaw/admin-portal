name: admin-portal

x-pg-common: &pg-common
  image: postgres:16-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 5s
    timeout: 5s
    retries: 20

services:
  pg-keycloak:
    <<: *pg-common
    container_name: pg-keycloak
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    ports: ["5433:5432"]
    volumes: ["pg-keycloak-data:/var/lib/postgresql/data"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: keycloak
    restart: unless-stopped
    command: ["start-dev", "--features=organization", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: sysadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: sysadmin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://pg-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: "true"
    ports: ["8080:8080"]
    depends_on:
      pg-keycloak: { condition: service_healthy }

  pg-librechat:
    <<: *pg-common
    container_name: pg-librechat
    environment:
      POSTGRES_USER: librechat
      POSTGRES_PASSWORD: librechat
      POSTGRES_DB: librechat
    ports: ["5434:5432"]
    volumes:
      - "pg-librechat-data:/var/lib/postgresql/data"

  pg-ldm:
    <<: *pg-common
    container_name: pg-ldm
    environment:
      POSTGRES_USER: ldm
      POSTGRES_PASSWORD: ldm
      POSTGRES_DB: ldm
    ports: ["5435:5432"]
    volumes:
      - "pg-ldm-data:/var/lib/postgresql/data"

  pg-tenant:
    <<: *pg-common
    container_name: pg-tenant
    environment:
      POSTGRES_USER: tenant
      POSTGRES_PASSWORD: tenant
      POSTGRES_DB: tenant
    ports: ["5436:5432"]
    volumes: ["pg-tenant-data:/var/lib/postgresql/data"]

  pg-audit:
    <<: *pg-common
    container_name: pg-audit
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
      POSTGRES_DB: audit
    ports: ["5437:5432"]
    volumes: ["pg-audit-data:/var/lib/postgresql/data"]

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    restart: unless-stopped
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: admin-portal-local-cluster
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]

volumes:
  pg-tenant-data:
  pg-audit-data:
  kafka-data:
  pg-keycloak-data:
  pg-librechat-data:
  pg-ldm-data:
  redis-data:
